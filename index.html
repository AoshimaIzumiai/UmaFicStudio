<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UmaStudio — 架空赛马血统管理工具</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <script src="js/i18n.js"></script>
</head>
<body>
  <!-- 欢迎界面 -->
  <div id="welcome-screen" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#1a1a2e;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;text-align:center;padding:24px;">
    <h1 style="font-size:2.5rem;margin:0;">UmaStudio</h1>
    <p style="font-size:1.1rem;color:#aaa;margin:12px 0 4px;">架空赛马血统管理工具</p>
    <p style="font-size:0.9rem;color:#666;margin:0 0 32px;">Fictional Horse Racing Pedigree Manager</p>
    <button onclick="document.getElementById('welcome-screen').style.display='none'" style="padding:12px 32px;font-size:1rem;border:none;border-radius:6px;background:#4a90d9;color:#fff;cursor:pointer;">开始使用 / Enter</button>
    <div style="margin-top:16px;display:flex;gap:12px">
      <button onclick="I18N.setLang('zh');document.getElementById('welcome-screen').style.display='none';App._applyI18n()" style="padding:6px 16px;border:1px solid #555;background:none;color:#aaa;border-radius:4px;cursor:pointer;">中文</button>
      <button onclick="I18N.setLang('en');document.getElementById('welcome-screen').style.display='none';App._applyI18n()" style="padding:6px 16px;border:1px solid #555;background:none;color:#aaa;border-radius:4px;cursor:pointer;">English</button>
    </div>
    <p style="position:absolute;bottom:16px;color:#555;font-size:11px;">© 2026 UmaFicStudio | 反馈与建议请提交 <a href="https://github.com/AoshimaIzumiai/UmaFicStudio/issues" style="color:#4a90d9" target="_blank">GitHub Issue</a> 或 QQ: 2233504794</p>
  </div>

  <nav id="main-nav">
    <div class="nav-brand">UmaStudio</div>
    <div class="nav-search">
      <input type="text" id="search-input" placeholder="搜索种马名...">
    </div>
    <div class="nav-links">
      <button class="nav-btn active" data-view="search">浏览</button>
      <button class="nav-btn" data-view="manage">设定管理</button>
      <button class="nav-btn" data-view="damline">母系管理</button>
      <button class="nav-btn" data-view="simulate">配种模拟</button>
      <button class="nav-btn nav-mode" id="mode-toggle" onclick="App.toggleMode()">模式：架空</button>
      <button class="nav-btn" onclick="I18N.setLang(I18N.getLang()==='zh'?'en':'zh');App._applyI18n();App.updateModeButton()">🌐</button>
    </div>
  </nav>

  <main id="app">
    <section id="view-search" class="view">
      <h2 id="search-title">种马数据库</h2>
      <div id="search-results"></div>
    </section>

    <section id="view-manage" class="view hidden">
      <div class="manage-layout">
        <aside class="manage-sidebar">
          <button class="sidebar-btn active" data-tab="horse" onclick="App.switchTab('horse')">马匹</button>
          <button class="sidebar-btn" data-tab="history" onclick="App.switchTab('history')">历史重赏</button>
          <button class="sidebar-btn" data-tab="owner" onclick="App.switchTab('owner')">马主</button>
          <button class="sidebar-btn" data-tab="trainer" onclick="App.switchTab('trainer')">练马师</button>
          <button class="sidebar-btn" data-tab="farm" onclick="App.switchTab('farm')">牧场</button>
          <button class="sidebar-btn" data-tab="jockey" onclick="App.switchTab('jockey')">骑手</button>
          <button class="sidebar-btn" data-tab="country" onclick="App.switchTab('country')">国家</button>
        </aside>
        <div class="manage-content" id="manage-content"></div>
      </div>
    </section>

    <section id="view-pedigree" class="view hidden">
      <h2>血统表</h2>
      <div id="pedigree-content"></div>
    </section>

    <section id="view-damline" class="view hidden">
      <h2>母系管理</h2>
      <div id="damline-content"></div>
    </section>

    <section id="view-simulate" class="view hidden">
      <h2>配种模拟</h2>
      <div id="simulate-content"></div>
    </section>
  </main>

  <!-- PDF/PNG 导出 modal -->
  <div class="modal-overlay" id="pdf-modal">
    <div class="modal-content">
      <h4>导出血统表</h4>
      <p>选择代数和格式：</p>
      <div class="modal-options">
        <button class="btn btn-primary" onclick="PDFExport._confirmExport(3)">3代PDF</button>
        <button class="btn btn-primary" onclick="PDFExport._confirmExport(4)">4代PDF</button>
        <button class="btn btn-primary" onclick="PDFExport._confirmExport(5)">5代PDF</button>
      </div>
      <div class="modal-options" style="margin-top:8px">
        <button class="btn btn-secondary" onclick="PDFExport.exportPNG(PDFExport.currentHorseId,3)">3代PNG</button>
        <button class="btn btn-secondary" onclick="PDFExport.exportPNG(PDFExport.currentHorseId,4)">4代PNG</button>
        <button class="btn btn-secondary" onclick="PDFExport.exportPNG(PDFExport.currentHorseId,5)">5代PNG</button>
      </div>
      <button class="btn btn-secondary" onclick="PDFExport._closeModal()" style="margin-top:12px">取消</button>
    </div>
  </div>

  <!-- 档案导出 modal -->
  <div class="modal-overlay" id="profile-modal">
    <div class="modal-content">
      <h4>导出马匹档案</h4>
      <p>选择血统表代数：</p>
      <div class="modal-options">
        <button class="btn btn-primary" onclick="PDFExport._confirmProfileExport(3)">3代</button>
        <button class="btn btn-primary" onclick="PDFExport._confirmProfileExport(4)">4代</button>
        <button class="btn btn-primary" onclick="PDFExport._confirmProfileExport(5)">5代</button>
      </div>
      <button class="btn btn-secondary" onclick="PDFExport._closeProfileModal()">取消</button>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/data-loader.js"></script>
  <script src="js/pedigree.js"></script>
  <script src="js/cross.js"></script>
  <script src="js/year-validator.js"></script>
  <script src="js/search.js"></script>
  <script src="js/export-import.js"></script>
  <script src="js/ui-pedigree.js"></script>
  <script src="js/ui-entities.js"></script>
  <script src="js/ui-horse.js"></script>
  <script src="js/ui-races.js"></script>
  <script src="js/ui-results.js"></script>
  <script src="js/ui-damline.js"></script>
  <script src="js/ui-simulate.js"></script>
  <script src="lib/html2canvas-1.4.1.min.js"></script>
  <script src="lib/jspdf-2.5.2.umd.min.js"></script>
  <script src="js/pdf-export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
